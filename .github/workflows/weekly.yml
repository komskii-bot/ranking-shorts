name: Weekly ranking Shorts batch

on:
  schedule:
    - cron: "0 8 * * 6"   # Saturdays 4:00 PM Manila: 7 videos for Mon–Sun of the coming week
  workflow_dispatch:      # "Run workflow" button for an extra batch
    inputs:
      count:
        description: "How many videos"
        default: "7"
      start:
        description: "First posting date YYYY-MM-DD (blank = next Monday)"
        default: ""

permissions:
  contents: write

concurrency:
  group: daily-short
  cancel-in-progress: false

jobs:
  make-video:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install FFmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: Install Python packages
        run: pip install -r requirements.txt

      - name: Render the batch
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
        run: |
          COUNT="${{ inputs.count }}"; START="${{ inputs.start }}"
          python -m pipeline.main --count "${COUNT:-7}" ${START:+--start "$START"}

      - name: Publish the batch (Releases page)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          FIRST=$(ls out/batch/*.json | head -1 | xargs python -c "import json,sys;print(json.load(open(sys.argv[1]))['post_on'])")
          TAG="week-${FIRST}-${{ github.run_number }}"
          gh release create "$TAG" out/batch/*.mp4 --title "Bojji videos from ${FIRST}" --notes-file out/upload_sheet.md

      - name: Save queue and history
        run: |
          git config user.name "ranking-bot"
          git config user.email "ranking-bot@users.noreply.github.com"
          git add state/
          git diff --cached --quiet || git commit -m "Daily run $(date -u +%F)"
          git push

      - name: Keep only the newest 30 video releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release list --limit 200 --json tagName --jq '.[30:][].tagName' | while read -r t; do
            gh release delete "$t" --yes --cleanup-tag || true
          done
