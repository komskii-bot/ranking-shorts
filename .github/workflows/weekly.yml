name: Weekly ranking Shorts batch

on:
  # Started every Saturday by Claude's "Bojji weekly video batch" scheduled task, right after it
  # writes the week's scripts. You can also start it by hand: Actions → Run workflow.
  workflow_dispatch:
    inputs:
      count:
        description: "How many ranking videos (8:00 AM slot)"
        default: "7"
      start:
        description: "First ranking date YYYY-MM-DD (blank = next Monday)"
        default: ""
      quiz_count:
        description: "How many quiz videos (9:00 PM slot)"
        default: "7"
      quiz_start:
        description: "First quiz date YYYY-MM-DD (blank = the Sunday before next Monday)"
        default: ""

permissions:
  contents: write

concurrency:
  group: daily-short
  cancel-in-progress: false

jobs:
  make-video:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install FFmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: Install Python packages
        run: pip install -r requirements.txt

      - name: Render the batch
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
        run: |
          rm -rf out
          COUNT="${{ inputs.count }}"; START="${{ inputs.start }}"
          QCOUNT="${{ inputs.quiz_count }}"; QSTART="${{ inputs.quiz_start }}"
          if [ -z "$QSTART" ]; then
            QSTART=$(python -c "from pipeline.main import next_monday; import datetime as d; print(next_monday() - d.timedelta(days=1))")
          fi
          python -m pipeline.main --kind ranking --count "${COUNT:-7}" ${START:+--start "$START"}
          python -m pipeline.main --kind quiz --count "${QCOUNT:-7}" --start "$QSTART"
          python -m pipeline.main --merge

      - name: Publish the batch (Releases page)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          FIRST=$(python -c "import json,glob;print(min(json.load(open(f))['post_on'] for f in glob.glob('out/batch/*.json')))")
          TAG="week-${FIRST}-${{ github.run_number }}"
          gh release create "$TAG" out/batch/*.mp4 --title "Bojji videos from ${FIRST}" --notes-file out/upload_sheet.md

      - name: Save queue and history
        run: |
          git config user.name "ranking-bot"
          git config user.email "ranking-bot@users.noreply.github.com"
          git add state/
          git diff --cached --quiet || git commit -m "Daily run $(date -u +%F)"
          git push

      - name: Keep only the newest 30 video releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release list --limit 200 --json tagName --jq '.[30:][].tagName' | while read -r t; do
            gh release delete "$t" --yes --cleanup-tag || true
          done
