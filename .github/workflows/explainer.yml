name: Bojji Explains (long video)

on:
  # Started by Claude after the voice-over for an episode is added under explainers/<id>/.
  workflow_dispatch:
    inputs:
      episode:
        description: "Folder under explainers/ (e.g. desert-data-centers)"
        required: true
      mode:
        description: "render, or timing (only time the voice and commit timing.json)"
        default: "render"

permissions:
  contents: write

concurrency:
  group: explainer
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install FFmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: Install Python packages
        run: pip install -r requirements.txt numpy faster-whisper

      - name: Time the voice only
        if: inputs.mode == 'timing'
        run: |
          python -m pipeline.explainer "explainers/${{ inputs.episode }}" --timing-only
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "explainers/${{ inputs.episode }}/timing.json"
          git commit -m "Voice timing for ${{ inputs.episode }}" && git push

      - name: Render the episode
        if: inputs.mode != 'timing'
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
        run: |
          rm -rf out
          python -m pipeline.explainer "explainers/${{ inputs.episode }}" --frames
          ls -la out/explainer

      - name: Publish (Releases page)
        if: inputs.mode != 'timing'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd out/explainer
          (cd frames && zip -q ../preview_frames.zip *.jpg)
          TAG="explainer-${{ inputs.episode }}-${{ github.run_number }}"
          gh release create "$TAG" "${{ inputs.episode }}.mp4" thumbnail.jpg preview_frames.zip timing.json \
            --title "Bojji Explains: ${{ inputs.episode }}" --notes-file upload_sheet.md
