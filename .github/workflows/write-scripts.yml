name: Write more scripts

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Fill the queue up to this many scripts"
        default: "10"

permissions:
  contents: write

concurrency:
  group: daily-short
  cancel-in-progress: false

jobs:
  write:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Write scripts with Gemini
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python -m pipeline.main --write "${{ inputs.target }}"
      - name: Save queue
        run: |
          git config user.name "ranking-bot"
          git config user.email "ranking-bot@users.noreply.github.com"
          git add state/
          git diff --cached --quiet || git commit -m "Write scripts $(date -u +%F)"
          git push
