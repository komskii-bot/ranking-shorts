name: Sample Short (smoke test)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - run: pip install -r requirements.txt chatterbox-tts
      - name: Render sample
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
        run: python tools/smoke_short.py
      - name: Publish
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "smoke-${{ github.run_number }}" out/smoke/sample_top10.mp4 out/smoke/info.txt --title "Sample Short" --notes "Smoke test (placeholder data)"
