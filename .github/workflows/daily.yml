name: Daily ranking Short

on:
  schedule:
    - cron: "0 8 * * *"   # 4:00 PM Manila time, every day (Claude sends it to you ~6:20 PM)
  workflow_dispatch: {}   # "Run workflow" button for an extra video

permissions:
  contents: write

concurrency:
  group: daily-short
  cancel-in-progress: false

jobs:
  make-video:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install FFmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: Install Python packages
        run: pip install -r requirements.txt

      - name: Render today's video
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
        run: python -m pipeline.main

      - name: Publish the video for download (Releases page)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ID=$(python -c "import json;print(json.load(open('out/post.json'))['script_id'])")
          TITLE=$(python -c "import json;print(json.load(open('out/post.json'))['title'])")
          TAG="video-$(TZ=Asia/Manila date +%Y%m%d)-${{ github.run_number }}"
          FILE="out/$(TZ=Asia/Manila date +%Y-%m-%d)_${ID}.mp4"
          cp out/video.mp4 "$FILE"
          gh release create "$TAG" "$FILE" --title "$TITLE" --notes-file out/upload_notes.md

      - name: Save queue and history
        run: |
          git config user.name "ranking-bot"
          git config user.email "ranking-bot@users.noreply.github.com"
          git add state/
          git diff --cached --quiet || git commit -m "Daily run $(date -u +%F)"
          git push

      - name: Keep only the newest 30 video releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release list --limit 200 --json tagName --jq '.[30:][].tagName' | while read -r t; do
            gh release delete "$t" --yes --cleanup-tag || true
          done
